<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ShortsCup AI — Control Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,.6); transform: scale(1); }
      50%      { box-shadow: 0 0 28px 8px rgba(239,68,68,.45); transform: scale(1.02); }
    }
    .launch-btn { animation: pulseGlow 1.8s ease-in-out infinite; }
  </style>
</head>
<body style="background-color:#0f172a; color:#f8fafc;" class="min-h-screen">
  <!-- Loading interceptor overlay -->
  <div id="overlay"
       class="fixed inset-0 z-50 hidden flex-col items-center justify-center gap-6"
       style="background-color:rgba(15,23,42,.92);">
    <div class="h-16 w-16 animate-spin rounded-full border-4 border-slate-600"
         style="border-top-color:#ef4444;"></div>
    <p class="text-lg font-semibold" style="color:#f8fafc;">
      Scraping &amp; Analyzing Live YouTube Shorts... Please Wait.
    </p>
    <p class="text-sm" style="color:#94a3b8;">This can take a few minutes — keep this tab open.</p>
  </div>

  <main class="mx-auto max-w-4xl px-4 py-10">
    <header class="mb-10 text-center">
      <h1 class="text-4xl font-extrabold" style="color:#f8fafc;">⚽ ShortsCup AI</h1>
      <p class="mt-2" style="color:#94a3b8;">Keyword Control Panel — configure your scan and launch the engine.</p>
    </header>

    <form id="launchForm" method="POST" action="{{ url_for('run') }}" class="space-y-6">
      {% for cat_key, cat in categories.items() %}
      <div class="rounded-2xl p-6 shadow-lg" style="background-color:#1e293b;">
        <label class="mb-2 block text-sm font-semibold uppercase tracking-wider"
               style="color:#38bdf8;">{{ cat.label }}</label>
        <p class="mb-3 text-xs" style="color:#94a3b8;">One keyword per line.</p>
        <textarea name="kw_{{ cat_key }}" rows="4"
                  class="w-full rounded-lg p-3 font-mono text-sm focus:outline-none focus:ring-2"
                  style="background-color:#0f172a; color:#f8fafc; border:1px solid #334155;"
                  >{{ cat.keywords | join('\n') }}</textarea>
      </div>
      {% endfor %}

      <div class="pt-2 text-center">
        <button type="submit"
                class="launch-btn rounded-2xl px-10 py-5 text-xl font-extrabold text-white"
                style="background-color:#ef4444;">
          ⚡ Launch ShortsCup AI Engine
        </button>
      </div>
    </form>
  </main>

  <script>
    document.getElementById('launchForm').addEventListener('submit', function () {
      var o = document.getElementById('overlay');
      o.classList.remove('hidden');
      o.classList.add('flex');
    });
  </script>
</body>
</html>
